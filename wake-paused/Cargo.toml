[package]
name = "wake-paused"
version = "0.1.0"
edition = "2024"
description = "Resume a paused docked-browser profile when its window is focused (GNOME Wayland)"
license = "MIT"

[dependencies]
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
