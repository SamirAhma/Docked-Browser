<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Mac-like rendering: soft antialiasing, light hinting -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>

  <!-- Sites that sniff for macOS / Windows UI fonts -->
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Roboto</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>Monaco</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="strong"><family>Consolas</family><prefer><family>JetBrains Mono</family></prefer></alias>
</fontconfig>
